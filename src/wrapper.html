<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(150deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
    }
    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 3.5rem 4rem;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      min-width: 380px;
    }
    .title {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
      color: #fff;
      letter-spacing: 0.02em;
    }
    .prompt {
      font-size: 1rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
      color: rgba(255, 255, 255, 0.7);
    }
    .subtitle {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.45);
      margin-bottom: 2rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    input[type="text"] {
      -webkit-text-security: disc;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }
    input[type="text"]:focus {
      border-color: #2ecc71;
      box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.2);
    }
    button {
      padding: 0.75rem 1.2rem;
      font-size: 1rem;
      font-weight: 500;
      background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:active {
      transform: scale(0.98);
    }
    .error {
      color: #e74c3c;
      margin-top: 0.75rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">{{TITLE}}</h1>
    <p class="prompt">Password required</p>
    <p class="subtitle">This content is encrypted</p>
    <form id="form">
      <input type="text" id="password" autofocus autocomplete="off" placeholder="Enter password">
      <button type="submit">Unlock</button>
    </form>
    <div id="error" class="error"></div>
  </div>

  <script>
    const PAYLOAD           = "{{PAYLOAD}}";
    const PBKDF2_ITERATIONS = 600000;
    const STORAGE_KEY       = "kijk-key";
    const MONITOR_KEY       = "{{MONITOR_KEY}}";
    const MONITOR_DATA      = "{{MONITOR_DATA}}";

    function parsePayload() {
      const raw        = Uint8Array.from(atob(PAYLOAD), (c) => c.charCodeAt(0));
      const salt       = raw.slice(0, 16);
      const iv         = raw.slice(16, 28);
      const ciphertext = raw.slice(28);
      return { salt, iv, ciphertext };
    }

    async function deriveKeyBits(password, salt) {
      const keyData = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveBits"]
      );
      return await crypto.subtle.deriveBits(
        { name: "PBKDF2", salt: salt, iterations: PBKDF2_ITERATIONS, hash: "SHA-256" },
        keyData,
        256
      );
    }

    async function decryptWith(keyBits, iv, ciphertext) {
      const aesKey = await crypto.subtle.importKey(
        "raw",
        keyBits,
        { name: "AES-GCM" },
        false,
        ["decrypt"]
      );
      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        aesKey,
        ciphertext
      );
      return new TextDecoder().decode(decrypted);
    }

    async function decryptMonitor() {
      const keyBytes  = Uint8Array.from(atob(MONITOR_KEY), (c) => c.charCodeAt(0));
      const dataBytes = Uint8Array.from(atob(MONITOR_DATA), (c) => c.charCodeAt(0));
      const iv         = dataBytes.slice(0, 12);
      const ciphertext = dataBytes.slice(12);
      const aesKey = await crypto.subtle.importKey(
        "raw",
        keyBytes,
        { name: "AES-GCM" },
        false,
        ["decrypt"]
      );
      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        aesKey,
        ciphertext
      );
      return JSON.parse(new TextDecoder().decode(decrypted));
    }

    async function encryptLogEntry(text, keyBits) {
      const iv     = crypto.getRandomValues(new Uint8Array(12));
      const aesKey = await crypto.subtle.importKey(
        "raw",
        keyBits,
        { name: "AES-GCM" },
        false,
        ["encrypt"]
      );
      const encrypted = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        aesKey,
        new TextEncoder().encode(text)
      );
      const combined = new Uint8Array(12 + encrypted.byteLength);
      combined.set(iv, 0);
      combined.set(new Uint8Array(encrypted), 12);
      return btoa(String.fromCharCode(...combined));
    }

    async function logAccess(event, keyBits) {
      if (!MONITOR_KEY) {
        return;
      }
      try {
        const config = await decryptMonitor();
        let ip = "unknown";
        try {
          const ctrl = new AbortController();
          const tid  = setTimeout(() => ctrl.abort(), 3000);
          const resp = await fetch("https://api.ipify.org?format=text", { signal: ctrl.signal });
          clearTimeout(tid);
          ip = (await resp.text()).trim();
        } catch {
          // timeout or network error — keep "unknown"
        }
        const line = `${event} | ${new Date().toISOString()} | IP: ${ip} | UA: ${navigator.userAgent}`;
        let body;
        if (keyBits) {
          const encrypted = await encryptLogEntry(line, keyBits);
          body = `[secure:${encrypted}]`;
        } else {
          const monKeyBytes = Uint8Array.from(atob(MONITOR_KEY), (c) => c.charCodeAt(0));
          const encrypted   = await encryptLogEntry(line, monKeyBytes);
          body = `[obfuscated:${encrypted}]`;
        }
        fetch(config.url, {
          method: "POST",
          headers: {
            "Authorization": `token ${config.token}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ body: body }),
        }).catch(() => {});
      } catch {
        // monitoring must never break the page
      }
    }

    function renderContent(html) {
      document.open();
      document.write(html);
      document.close();

      const btn       = document.createElement("button");
      btn.textContent = "Logout";
      btn.style.cssText = [
        "position:fixed",
        "top:8px",
        "left:8px",
        "padding:4px 10px",
        "font-size:0.8rem",
        "background:rgba(0,0,0,0.35)",
        "color:#fff",
        "border:none",
        "border-radius:4px",
        "cursor:pointer",
        "opacity:0.5",
        "transition:opacity 0.2s",
        "z-index:999999",
      ].join(";");
      btn.addEventListener("mouseenter", () => { btn.style.opacity = "1"; });
      btn.addEventListener("mouseleave", () => { btn.style.opacity = "0.5"; });
      btn.addEventListener("click", () => {
        sessionStorage.removeItem(STORAGE_KEY);
        location.reload();
      });
      document.body.appendChild(btn);
    }

    async function decryptWithPassword(password) {
      const { salt, iv, ciphertext } = parsePayload();
      const keyBits                  = await deriveKeyBits(password, salt);
      const html                     = await decryptWith(keyBits, iv, ciphertext);
      sessionStorage.setItem(STORAGE_KEY, btoa(String.fromCharCode(...new Uint8Array(keyBits))));
      logAccess("Unlock", new Uint8Array(keyBits));
      renderContent(html);
    }

    async function restoreSession() {
      const stored = sessionStorage.getItem(STORAGE_KEY);
      if (!stored) {
        return;
      }
      try {
        const keyBits            = Uint8Array.from(atob(stored), (c) => c.charCodeAt(0));
        const { iv, ciphertext } = parsePayload();
        const html               = await decryptWith(keyBits, iv, ciphertext);
        logAccess("Session restore", keyBits);
        renderContent(html);
      } catch {
        sessionStorage.removeItem(STORAGE_KEY);
      }
    }

    // Auto-decrypt from stored key on page load
    restoreSession();

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl    = document.getElementById("error");
      const passwordEl = document.getElementById("password");
      errorEl.textContent = "";

      try {
        await decryptWithPassword(passwordEl.value);
      } catch {
        logAccess("Failed attempt", null);
        errorEl.textContent = "Wrong password";
        passwordEl.value = "";
        passwordEl.focus();
      }
    });
  </script>
</body>
</html>
