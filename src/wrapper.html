<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kijk</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(150deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
    }
    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 3.5rem 4rem;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      min-width: 380px;
    }
    .lock {
      font-size: 2.8rem;
      margin-bottom: 1rem;
      opacity: 0.85;
    }
    h1 {
      font-size: 1.3rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: #fff;
      letter-spacing: 0.02em;
    }
    .subtitle {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.45);
      margin-bottom: 2rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    input[type="password"] {
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="password"]::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }
    input[type="password"]:focus {
      border-color: #e94560;
      box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.2);
    }
    button {
      padding: 0.75rem 1.2rem;
      font-size: 1rem;
      font-weight: 500;
      background: linear-gradient(135deg, #e94560 0%, #c2185b 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:active {
      transform: scale(0.98);
    }
    .error {
      color: #ff6b81;
      margin-top: 0.75rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="lock">&#x1f512;</div>
    <h1>Password required</h1>
    <p class="subtitle">This content is encrypted</p>
    <form id="form">
      <input type="password" id="password" autofocus placeholder="Enter password">
      <button type="submit">Unlock</button>
    </form>
    <div id="error" class="error"></div>
  </div>

  <script>
    const PAYLOAD           = "{{PAYLOAD}}";
    const PBKDF2_ITERATIONS = 600000;
    const STORAGE_KEY       = "kijk-key";

    function parsePayload() {
      const raw        = Uint8Array.from(atob(PAYLOAD), (c) => c.charCodeAt(0));
      const salt       = raw.slice(0, 16);
      const iv         = raw.slice(16, 28);
      const ciphertext = raw.slice(28);
      return { salt, iv, ciphertext };
    }

    async function deriveKeyBits(password, salt) {
      const keyData = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveBits"]
      );
      return await crypto.subtle.deriveBits(
        { name: "PBKDF2", salt: salt, iterations: PBKDF2_ITERATIONS, hash: "SHA-256" },
        keyData,
        256
      );
    }

    async function decryptWith(keyBits, iv, ciphertext) {
      const aesKey = await crypto.subtle.importKey(
        "raw",
        keyBits,
        { name: "AES-GCM" },
        false,
        ["decrypt"]
      );
      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        aesKey,
        ciphertext
      );
      return new TextDecoder().decode(decrypted);
    }

    function renderContent(html) {
      document.open();
      document.write(html);
      document.close();

      const btn       = document.createElement("button");
      btn.textContent = "Logout";
      btn.style.cssText = [
        "position:fixed",
        "top:8px",
        "left:8px",
        "padding:4px 10px",
        "font-size:0.8rem",
        "background:rgba(0,0,0,0.35)",
        "color:#fff",
        "border:none",
        "border-radius:4px",
        "cursor:pointer",
        "opacity:0.5",
        "transition:opacity 0.2s",
        "z-index:999999",
      ].join(";");
      btn.addEventListener("mouseenter", () => { btn.style.opacity = "1"; });
      btn.addEventListener("mouseleave", () => { btn.style.opacity = "0.5"; });
      btn.addEventListener("click", () => {
        sessionStorage.removeItem(STORAGE_KEY);
        location.reload();
      });
      document.body.appendChild(btn);
    }

    async function decryptWithPassword(password) {
      const { salt, iv, ciphertext } = parsePayload();
      const keyBits                  = await deriveKeyBits(password, salt);
      const html                     = await decryptWith(keyBits, iv, ciphertext);
      sessionStorage.setItem(STORAGE_KEY, btoa(String.fromCharCode(...new Uint8Array(keyBits))));
      renderContent(html);
    }

    async function restoreSession() {
      const stored = sessionStorage.getItem(STORAGE_KEY);
      if (!stored) {
        return;
      }
      try {
        const keyBits                = Uint8Array.from(atob(stored), (c) => c.charCodeAt(0));
        const { iv, ciphertext }     = parsePayload();
        const html                   = await decryptWith(keyBits, iv, ciphertext);
        renderContent(html);
      } catch {
        sessionStorage.removeItem(STORAGE_KEY);
      }
    }

    // Auto-decrypt from stored key on page load
    restoreSession();

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl    = document.getElementById("error");
      const passwordEl = document.getElementById("password");
      errorEl.textContent = "";

      try {
        await decryptWithPassword(passwordEl.value);
      } catch {
        errorEl.textContent = "Wrong password";
        passwordEl.value = "";
        passwordEl.focus();
      }
    });
  </script>
</body>
</html>
